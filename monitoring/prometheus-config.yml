apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
# Prometheus가 node-exporter가 수집한 노드(서버)의 시스템 정보를 15초마다 데이터를 주기적으로 받아 저장하고 처리 => prometheus.yml로 저장 
#  <노드 IP>:10250 : Prometheus가 k8s 노드를 자동 탐색할 때 사용하는 기본 주소(__address__라벨이 붙어있음). 이것을 :9100 으로 대체
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '(.*):10250'
            replacement: '${1}:9100'
            target_label: __address__
      
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # EKS 자가서명 인증서 통과를 위해 주석 해제하거나 설정 가능
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        # 쿠버네티스 API를 통해 '노드' 목록을 자동으로 알아내서 타겟으로 지정
        kubernetes_sd_configs:
          - role: node

        # 들어온 메트릭 주소를 cAdvisor 전용 주소로 치환하는 작업 (Relabeling)
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor      
